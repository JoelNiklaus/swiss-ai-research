[project]
name = "swiss-ai"
version = "0.1.0"
description = "Data pipeline for a blog post on Swiss representation in AI research"
authors = [
    { name = "Joel Niklaus", email = "j.niklaus.95@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "joblib>=1.6.0",
    "kaleido>=1.5.0",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]
# The project style indexes dicts directly instead of calling .get.
ignore = ["SIM401", "RUF019"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=swiss_ai --cov-report=term-missing"
